<style>
  :root{
    --paper:#f3f2ee;
    --ink:#1c1c1a;
    --ink-soft:#5a5850;
    --rule:#d8d5cb;
    --accent:#2f5d50;
    --accent-soft:#e4ece9;
    --warn:#a8471f;
    --warn-soft:#f3e3da;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  #root{
    background:var(--paper);
    color:var(--ink);
    min-height:100%;
    padding:28px 18px 40px;
    display:flex;
    justify-content:center;
  }
  .shell{width:100%;max-width:620px;}

  .kicker{
    font-family:"Courier New",monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1{
    font-size:22px;
    margin:0 0 18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .card{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:2px;
    padding:22px;
    margin-bottom:16px;
  }

  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .row .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
  .timer{
    font-family:"Courier New",monospace;
    font-size:26px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .timer.warn{color:var(--warn);}
  .bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:20px;}
  .bar-fill{height:100%;background:var(--accent);transition:width .3s linear;}
  .bar-fill.warn{background:var(--warn);}

  .passage-text{
    font-size:17px;
    line-height:1.65;
    user-select:none;
    -webkit-user-select:none;
  }
  .passage-topic{
    font-size:12px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:10px;
    font-weight:600;
  }

  textarea{
    width:100%;
    min-height:150px;
    font-size:15px;
    line-height:1.6;
    font-family:inherit;
    border:1px solid var(--rule);
    border-radius:2px;
    padding:12px;
    resize:vertical;
    background:#fdfdfc;
    color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .wordcount{font-size:12px;color:var(--ink-soft);margin-top:6px;text-align:right;}

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:2px;
    padding:12px 20px;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
  }
  button:hover{opacity:.88;}
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--rule);
  }
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}

  .center{text-align:center;padding:50px 20px;}
  .center p{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:440px;margin:10px auto 26px;}

  .progress-dots{display:flex;gap:6px;margin-bottom:18px;}
  .dot{width:26px;height:4px;border-radius:2px;background:var(--rule);}
  .dot.done{background:var(--accent);}
  .dot.active{background:var(--ink);}

  .feedback-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:2px;
    letter-spacing:.03em;
    margin-right:6px;
    margin-bottom:6px;
  }
  .tag-good{background:var(--accent-soft);color:var(--accent);}
  .tag-warn{background:var(--warn-soft);color:var(--warn);}
  .tag-tip{background:#eee9de;color:var(--ink-soft);}

  .copied-phrase{
    background:var(--warn-soft);
    color:var(--warn);
    padding:1px 4px;
    border-radius:2px;
    font-weight:600;
  }

  .divider{height:1px;background:var(--rule);margin:16px 0;}

  .summary-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-topic{font-weight:600;}
  .summary-stat{color:var(--ink-soft);font-size:12px;}

  .small-note{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:14px;}

const READ_SECONDS = 30;
const WRITE_SECONDS = 90;
const NUM_ROUNDS = 4;
const STOPWORDS = new Set(("the a an of to in on for and or but with as by is are was were has have had this that these those it its their his her they them from at into over under while also such more most much than then so not no can could may might will would should about between among across per which who whom whose".split(" ")));

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function tokenize(str){
  return str.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
}
function analyze(original, response){
  const origWords = tokenize(original);
  const respWords = tokenize(response);
  const respRaw = response.trim();

  // 4-gram exact copy detection
  const origGrams = new Set();
  for(let i=0;i<=origWords.length-4;i++){
    origGrams.add(origWords.slice(i,i+4).join(" "));
  }
  let copiedCount = 0;
  const copiedExamples = [];
  for(let i=0;i<=respWords.length-4;i++){
    const g = respWords.slice(i,i+4).join(" ");
    if(origGrams.has(g)){
      copiedCount++;
      if(copiedExamples.length<3) copiedExamples.push(g);
    }
  }

  // keyword coverage (content words len>4, not stopword)
  const origKeywords = [...new Set(origWords.filter(w=>w.length>4 && !STOPWORDS.has(w)))];
  const respSet = new Set(respWords);
  const covered = origKeywords.filter(w=>respSet.has(w));
  const coverageRatio = origKeywords.length ? covered.length/origKeywords.length : 0;

  const lengthRatio = origWords.length ? respWords.length/origWords.length : 0;

  return {
    wordCount: respWords.length,
    origWordCount: origWords.length,
    copiedCount,
    copiedExamples,
    coverageRatio,
    lengthRatio,
    isEmpty: respRaw.length===0
  };
}

function App(){
  const [screen, setScreen] = React.useState("intro"); // intro | read | write | feedback | summary
  const [round, setRound] = React.useState(0);
  const [passages, setPassages] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState(READ_SECONDS);
  const [response, setResponse] = React.useState("");
  const [results, setResults] = React.useState([]);
  const timerRef = React.useRef(null);

  function startSession(){
    setPassages(shuffle(PASSAGES).slice(0, NUM_ROUNDS));
    setResults([]);
    setRound(0);
    setResponse("");
    setScreen("read");
    setTimeLeft(READ_SECONDS);
  }

  React.useEffect(()=>{
    if(screen!=="read" && screen!=="write") return;
    if(timeLeft<=0){
      if(screen==="read"){
        setScreen("write");
        setTimeLeft(WRITE_SECONDS);
      } else {
        finishRound();
      }
      return;
    }
    timerRef.current = setTimeout(()=>setTimeLeft(t=>t-1), 1000);
    return ()=>clearTimeout(timerRef.current);
  }, [timeLeft, screen]);

  function finishRound(){
    const original = passages[round].text;
    const analysis = analyze(original, response);
    setResults(r=>[...r, {topic: passages[round].topic, original, response, analysis}]);
    setScreen("feedback");
  }

  function nextRound(){
    if(round+1 >= passages.length){
      setScreen("summary");
    } else {
      setRound(r=>r+1);
      setResponse("");
      setScreen("read");
      setTimeLeft(READ_SECONDS);
    }
  }

  function skipToWrite(){
    clearTimeout(timerRef.current);
    setScreen("write");
    setTimeLeft(WRITE_SECONDS);
  }

  function submitEarly(){
    clearTimeout(timerRef.current);
    finishRound();
  }

  const fmtTime = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

  if(screen==="intro"){
    return (
      <div className="shell">
        <p className="kicker">TCS NQT · Verbal Ability</p>
        <h1>Passage Recall Trainer</h1>
        <div className="card center">
          <p className="kicker" style={{marginBottom:12}}>Instructions</p>
          <p>
            You will have {READ_SECONDS} seconds to read a paragraph. After {READ_SECONDS} seconds, the paragraph will disappear from the screen.<br/><br/>
            Then, you will have {WRITE_SECONDS} seconds to reconstruct the paragraph. Show that you understood the passage by rewriting it in your own words.<br/><br/>
            Your answer will be scored for clear and accurate content, not word-for-word memorization. After {WRITE_SECONDS} seconds, your work will be saved automatically.<br/><br/>
            This session has {NUM_ROUNDS} passages, one at a time. No copy-paste, no going back — same as the real test.
          </p>
          <button onClick={startSession}>Start practice round</button>
        </div>
        <p className="small-note">Feedback below is heuristic (word retention, copied phrases, length) — a practice aid, not the official TCS grading engine.</p>
      </div>
    );
  }

  if(screen==="read" || screen==="write"){
    const isRead = screen==="read";
    const total = isRead ? READ_SECONDS : WRITE_SECONDS;
    const pct = Math.max(0, (timeLeft/total)*100);
    const warn = timeLeft<=10;
    return (
      <div className="shell">
        <div className="progress-dots">
          {passages.map((_,i)=>(
            <div key={i} className={`dot ${i<round?"done":i===round?"active":""}`}></div>
          ))}
        </div>
        <div className="card">
          <div className="row">
            <span className="label">{isRead ? "Read the passage" : "Rewrite from memory"} · Passage {round+1} of {passages.length}</span>
            <span className={`timer ${warn?"warn":""}`}>{fmtTime(timeLeft)}</span>
          </div>
          <div className="bar"><div className={`bar-fill ${warn?"warn":""}`} style={{width:pct+"%"}}></div></div>

          {isRead ? (
            <div>
              <p className="passage-topic">{passages[round].topic}</p>
              <p className="passage-text" onCopy={e=>e.preventDefault()}>{passages[round].text}</p>
              <div className="btn-row">
                <button className="secondary" onClick={skipToWrite}>Skip to writing</button>
              </div>
            </div>
          ) : (
            <div>
              <p className="passage-topic">{passages[round].topic}</p>
              <textarea
                autoFocus
                placeholder="Rewrite the passage in your own words..."
                value={response}
                onChange={e=>setResponse(e.target.value)}
                onPaste={e=>e.preventDefault()}
              />
              <div className="wordcount">{tokenize(response).length} words</div>
              <div className="btn-row">
                <button onClick={submitEarly}>Submit now</button>
              </div>
              <p className="small-note">Your work saves automatically when the timer hits zero — no need to rush a click.</p>
            </div>
          )}
        </div>
      </div>
    );
  }

  if(screen==="feedback"){
    const res = results[results.length-1];
    const a = res.analysis;
    const lenOk = a.lengthRatio>=0.5 && a.lengthRatio<=1.3;
    const coverageOk = a.coverageRatio>=0.4;
    const copyOk = a.copiedCount===0;

    return (
      <div className="shell">
        <div className="progress-dots">
          {passages.map((_,i)=>(
            <div key={i} className={`dot ${i<=round?"done":""}`}></div>
          ))}
        </div>
        <div className="card">
          <p className="label" style={{marginBottom:10}}>Passage {round+1} feedback</p>

          <div>
            <span className={`feedback-tag ${coverageOk?"tag-good":"tag-warn"}`}>
              {Math.round(a.coverageRatio*100)}% content accuracy
            </span>
            <span className={`feedback-tag ${lenOk?"tag-good":"tag-warn"}`}>
              {a.wordCount} words (original: {a.origWordCount})
            </span>
            <span className={`feedback-tag ${copyOk?"tag-good":"tag-tip"}`}>
              {copyOk ? "Fully in your own words" : `Tip: ${a.copiedCount} phrase(s) close to original`}
            </span>
          </div>

          {a.isEmpty && (
            <p className="small-note" style={{color:"var(--warn)"}}>You submitted nothing — try to jot at least a partial recall even under time pressure.</p>
          )}

          {a.copiedExamples.length>0 && (
            <div className="small-note">
              Close to original wording: {a.copiedExamples.map((c,i)=>(
                <span key={i} className="copied-phrase" style={{marginRight:6}}>"{c}"</span>
              ))}
              — not a scoring penalty by itself, but rewording these shows stronger understanding.
            </div>
          )}

          <div className="divider"></div>
          <p className="label" style={{marginBottom:8}}>Your rewrite</p>
          <p style={{fontSize:14,lineHeight:1.6,color:"var(--ink-soft)"}}>{res.response || "—"}</p>

          <div className="divider"></div>
          <p className="label" style={{marginBottom:8}}>Original passage</p>
          <p style={{fontSize:14,lineHeight:1.6,color:"var(--ink-soft)"}}>{res.original}</p>

          <div className="btn-row">
            <button onClick={nextRound}>{round+1>=passages.length ? "See summary" : "Next passage"}</button>
          </div>
        </div>
      </div>
    );
  }

  if(screen==="summary"){
    const avgCoverage = Math.round(results.reduce((s,r)=>s+r.analysis.coverageRatio,0)/results.length*100);
    const totalCopies = results.reduce((s,r)=>s+r.analysis.copiedCount,0);
    return (
      <div className="shell">
        <p className="kicker">Session complete</p>
        <h1>Summary</h1>
        <div className="card">
          <div className="summary-row">
            <span className="summary-topic">Average content accuracy</span>
            <span className="summary-stat">{avgCoverage}%</span>
          </div>
          <div className="summary-row">
            <span className="summary-topic">Phrases close to original wording</span>
            <span className="summary-stat">{totalCopies} (own-words tip, not a penalty)</span>
          </div>
          <div className="divider"></div>
          {results.map((r,i)=>(
            <div className="summary-row" key={i}>
              <span className="summary-topic">{r.topic}</span>
              <span className="summary-stat">{r.analysis.wordCount}w · {Math.round(r.analysis.coverageRatio*100)}% accuracy · {r.analysis.copiedCount} close-matches</span>
            </div>
          ))}
          <div className="btn-row">
            <button onClick={startSession}>Practice again</button>
          </div>
        </div>
        <p className="small-note">Real scoring focuses on clear, accurate content — not word-for-word memorization. Use content accuracy as your main signal; the close-match count is just a nudge toward more natural phrasing.</p>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
